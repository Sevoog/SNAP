# Builds SNAP and runs its tests on every push to main and every pull
# request. Runs with a read-only token and no secrets, so pull requests from
# forks are safe to test. The checkout action is pinned to the commit behind
# v7.0.1.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build and test
        # Signed to run locally only; no certificates are involved.
        run: |
          set -o pipefail
          xcodebuild test \
            -project SNAP.xcodeproj -scheme SNAP \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            | tee build.log | grep -E '^(Test Suite|Test Case .* failed|\*\* |.*error:)|Executed [0-9]+ tests'
      - name: Upload the log if it failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-log
          path: build.log
