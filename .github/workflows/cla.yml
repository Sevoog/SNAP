# Asks first-time contributors to sign the CLA (CLA.md) on their pull request,
# and records signatures on the `cla-signatures` branch (kept separate so
# `main` can be branch-protected).
#
# Uses pull_request_target so it can comment on pull requests from forks.
# It never checks out or runs pull-request code, which is what keeps that
# trigger safe. The action is pinned to the commit behind v2.6.1.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/Sevoog/SNAP/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          # The maintainer (copyright holder) and bots don't sign.
          allowlist: 'Sevoog,*[bot]'
          custom-notsigned-prcomment: 'Thanks for your contribution! Before it can be merged, please read the [Contributor License Agreement](https://github.com/Sevoog/SNAP/blob/main/CLA.md) and sign it by posting the comment below. You only need to do this once.'
